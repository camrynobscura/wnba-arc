<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The landing page's title; each page sets its own once it renders (src/pageArrival.ts). -->
    <title>WNBA Arc — Career Arc Visualizer</title>
    <!-- Apply the theme before first paint (stored choice, else OS) to avoid a flash. Storage is read in
         its own try: a browser that blocks site storage throws on the read, and that must not skip the
         stamp — the page would sit on the light palette whatever the OS said (craftsmanship review 2.7). -->
    <script>
      (function () {
        var t = null;
        try {
          var k = localStorage.getItem("arc-theme");
          if (k === "light" || k === "dark") t = k;
        } catch (e) {}
        if (!t) {
          try {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            t = "light";
          }
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
