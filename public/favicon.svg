<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mini deviation chart: baseline with a red bar above and a blue bar below,
       matching the app's above=red / below=blue convention. -->
  <rect width="32" height="32" fill="#f2f2f3"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="#98989b" stroke-width="1.5"/>
  <rect x="17" y="7" width="6" height="9" fill="#c0492a"/>
  <rect x="9" y="16" width="6" height="7" fill="#3f6d99"/>
</svg>
